<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNDO — Case desk</title><link rel="stylesheet" href="styles.css"></head><body class="admin-page"><header class="nav"><a class="logo" href="index.html"><span class="logo-mark">U</span> UNDO</a><nav><a href="index.html">Public site</a></nav></header><main class="admin-shell"><div class="eyebrow">INTERNAL CASE DESK</div><div class="admin-title-row"><div><h1>Case desk</h1><p>Live cases, triage and recovery tracking.</p></div><button id="login" class="ghost-btn">Set admin token</button></div><section class="stats"><div><span>Open</span><b id="openCount">—</b></div><div><span>Recovered</span><b id="recoveredCount">€0</b></div><div><span>Potential value</span><b id="potentialCount">€0</b></div></section><section class="admin-grid"><div class="case-list" id="caseList"><div class="empty-list">Set your admin token to load cases.</div></div><aside class="detail-card" id="detail"><div class="empty-detail">Select a case.</div></aside></section></main><script>
let token=sessionStorage.getItem('undo_admin_token')||'';let data=[];const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n||0));
async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){if(!token)return;try{const j=await api('/api/admin-cases');data=j.cases||[];render()}catch(e){$('caseList').innerHTML='<div class="empty-list">'+e.message+'</div>'}}
function render(){const open=data.filter(x=>!['Recovered','Closed'].includes(x.status)).length;const rec=data.reduce((a,x)=>a+Number(x.recovered_amount||0),0);const pot=data.reduce((a,x)=>a+Number(x.amount||0),0);$('openCount').textContent=open;$('recoveredCount').textContent=fmt(rec);$('potentialCount').textContent=fmt(pot);$('caseList').innerHTML=data.length?data.map(x=>`<button class="case-row" data-id="${x.id}"><span><b>${x.case_number}</b><small>${escapeHtml(x.merchant||'')} · ${escapeHtml(x.status||'')}</small></span><strong>${fmt(x.amount)}</strong></button>`).join(''):'<div class="empty-list">No cases yet.</div>';document.querySelectorAll('.case-row').forEach(b=>b.onclick=()=>show(b.dataset.id))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id){const x=data.find(c=>String(c.id)===String(id));if(!x)return;const a=x.ai_analysis; $('detail').innerHTML=`<div class="detail-head"><div><span class="status-pill">${escapeHtml(x.status)}</span><h2>${x.case_number}</h2></div><strong>${fmt(x.amount)}</strong></div><div class="detail-sections"><div><label>Customer</label><p>${escapeHtml(x.customer_name)} · ${escapeHtml(x.customer_email)}</p></div><div><label>Merchant</label><p>${escapeHtml(x.merchant)}</p></div><div><label>Problem</label><p>${escapeHtml(x.problem||'')}</p></div><div><label>Desired resolution</label><p>${escapeHtml(x.requested_outcome||'')}</p></div>${a?`<div><label>AI / triage</label><div class="analysis-grid"><div><b>Severity</b><span>${escapeHtml(a.severity||'—')}</span></div><div><b>Recoverability</b><span>${escapeHtml(a.recoverability||'—')}</span></div><div><b>Confidence</b><span>${a.confidence!=null?Math.round(Number(a.confidence)*100)+'%':'—'}</span></div></div><p>${escapeHtml(a.discrepancy||'')}</p><p><b>Route:</b> ${escapeHtml(a.recommended_route||'')}</p><p><b>Evidence:</b> ${(a.evidence_needed||[]).map(escapeHtml).join(' · ')}</p></div>`:''}</div><div class="action-row"><select id="statusSelect"><option value="new">New</option><option value="Investigating">Investigating</option><option value="Action">Action</option><option value="Recovered">Recovered</option><option value="Closed">Closed</option></select><input id="recoveredInput" type="number" min="0" step="0.01" placeholder="Recovered €" value="${x.recovered_amount||''}"><button id="saveCase">Save</button><button id="analyzeCase" class="ghost-btn">${a?'Re-analyze':'Analyze'}</button></div>`;$('statusSelect').value=x.status==='new'?'new':x.status;$('saveCase').onclick=async()=>{await api('/api/admin-cases',{method:'PATCH',body:JSON.stringify({id:x.id,status:$('statusSelect').value,recovered_amount:$('recoveredInput').value})});await load();show(x.id)};$('analyzeCase').onclick=async()=>{const b=$('analyzeCase');b.disabled=true;b.textContent='Analyzing…';try{await api('/api/analyze',{method:'POST',body:JSON.stringify({case_id:x.id})});await load();show(x.id)}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent=a?'Re-analyze':'Analyze'}}}
$('login').onclick=()=>{const v=prompt('ADMIN_TOKEN');if(v){token=v;sessionStorage.setItem('undo_admin_token',v);load()}};load();
</script></body></html>
