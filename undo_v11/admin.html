<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNDO — Case desk</title><link rel="stylesheet" href="styles.css"><style>
:root{--ink:#111;--muted:#6b6b6b;--line:#e6e2da;--paper:#f7f5ef;--card:#fff}.admin-main{padding-bottom:80px}.admin-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.admin-top h1{margin:6px 0 8px;font-size:clamp(40px,6vw,68px);letter-spacing:-.04em}.token-box{display:flex;gap:8px;min-width:340px}.token-box input,.filters input,.filters select,.actions select,.actions input{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;min-width:0}.token-box input{flex:1}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:34px 0}.admin-stats>div{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.admin-stats span{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}.admin-stats strong{font-size:30px;letter-spacing:-.03em}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{width:260px}.admin-grid{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.6fr);gap:14px}.list,.detail{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}.list{padding:8px;min-height:520px}.admin-row{width:100%;display:flex;justify-content:space-between;gap:12px;padding:16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;border-radius:16px}.admin-row:hover{background:#f7f5ef}.admin-row b{display:block}.admin-row small{display:block;color:var(--muted);margin-top:5px}.admin-row strong{white-space:nowrap}.detail{padding:24px;min-height:520px}.detail-top{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px}.detail-top h2{margin:4px 0 4px;font-size:30px}.detail-top p{margin:0;color:var(--muted)}.score{background:#111;color:#fff;padding:14px 18px;border-radius:18px;text-align:right;min-width:128px}.score span{display:block;font-size:18px;text-transform:capitalize}.score small{color:#bbb}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.detail-grid>div{background:var(--paper);padding:14px;border-radius:16px}.detail-grid label,.block label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.block{padding:16px 0;border-top:1px solid var(--line)}.block p{margin:0;line-height:1.55;white-space:normal}.ai-box{margin-top:18px;background:#111;color:#fff;border-radius:20px;padding:18px}.ai-box p{color:#e3e3e3;line-height:1.5}.ai-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.muted-box{background:#f7f5ef;color:#111}.muted-box p{color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions select,.actions input{height:46px}.actions .btn{border-radius:12px}.empty{padding:38px;text-align:center;color:var(--muted)}.error-box{color:#b42318}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 12px 40px #0002;display:none}.toast.show{display:block}@media(max-width:900px){.admin-top{flex-direction:column;align-items:stretch}.token-box{min-width:0}.admin-stats{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body class="admin-body"><header class="site-nav wrap"><a class="brand" href="index.html"><span class="brand-mark">U</span><span>UNDO</span></a><nav><a href="index.html">Public site</a><a href="status.html">Customer status</a></nav></header><main class="wrap admin-main"><div class="admin-top"><div><div class="eyebrow">PRIVATE OPERATIONS</div><h1>Case desk</h1><p>Turn incoming mistakes into organized, actionable recovery work.</p></div><div class="token-box"><input id="token" type="password" placeholder="Admin token"><button class="btn btn-dark" id="loginBtn">Unlock</button></div></div><section class="admin-stats"><div><span>Open cases</span><strong id="open">—</strong></div><div><span>Case value</span><strong id="potential">€0</strong></div><div><span>Recovered</span><strong id="recovered">€0</strong></div><div><span>Your success fees</span><strong id="fees">€0</strong></div></section><div class="toolbar"><div><div class="eyebrow">INBOX</div></div><div class="filters"><input id="search" placeholder="Search merchant, email, case…"><select id="filter"><option value="all">All statuses</option><option value="new">New</option><option value="Investigating">Investigating</option><option value="Contacted">Contacted</option><option value="Recovered">Recovered</option><option value="Closed">Closed</option></select></div></div><section class="admin-grid"><div class="list" id="list"><div class="empty">Enter your admin token to load cases.</div></div><aside class="detail" id="detail"><div class="empty">Select a case.</div></aside></section></main><div id="toast" class="toast"></div><script>
let token=sessionStorage.getItem('undo_admin_token')||'',cases=[],selectedId=null;const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n||0));
$('token').value=token;
function esc(s=''){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:`Bearer ${token}`,'Content-Type':'application/json'};const r=await fetch(url,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function filtered(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;return cases.filter(c=>(f==='all'||String(c.status||'new')===f)&&(!q||`${c.case_number} ${c.merchant} ${c.customer_email} ${c.customer_name}`.toLowerCase().includes(q)))}
function render(){const open=cases.filter(c=>!['Recovered','Closed','recovered','closed'].includes(c.status)).length;const potential=cases.reduce((a,c)=>a+Number(c.amount||0),0),rec=cases.reduce((a,c)=>a+Number(c.recovered_amount||0),0),fees=cases.reduce((a,c)=>a+Number(c.recovery_fee||0),0);$('open').textContent=open;$('potential').textContent=fmt(potential);$('recovered').textContent=fmt(rec);$('fees').textContent=fmt(fees);const list=filtered();$('list').innerHTML=list.length?list.map(c=>`<button class="admin-row" data-id="${esc(c.id)}"><span><b>${esc(c.case_number||'Case')}</b><small>${esc(c.merchant||'Unknown')} · ${esc(c.status||'new')}</small></span><strong>${fmt(c.amount)}</strong></button>`).join(''):'<div class="empty">No matching cases.</div>';document.querySelectorAll('.admin-row').forEach(x=>x.onclick=()=>showCase(x.dataset.id));if(selectedId&&!list.some(c=>String(c.id)===String(selectedId)))selectedId=null}
function showCase(id){selectedId=id;const c=cases.find(x=>String(x.id)===String(id));if(!c)return;const a=c.ai_analysis||{};$('detail').innerHTML=`<div class="detail-top"><div><div class="eyebrow">${esc(c.case_number||'')}</div><h2>${esc(c.merchant||'Unknown merchant')}</h2><p>${esc(c.customer_name||'')} · ${esc(c.customer_email||'')}</p></div><div class="score"><span>${esc(a.recoverability||'unanalysed')}</span><small>recovery potential</small></div></div><div class="detail-grid"><div><label>Amount</label><strong>${fmt(c.amount)}</strong></div><div><label>Status</label><strong>${esc(c.status||'new')}</strong></div><div><label>Recovered</label><strong>${fmt(c.recovered_amount)}</strong></div><div><label>Fee</label><strong>${fmt(c.recovery_fee)}</strong></div></div><div class="block"><label>Case facts</label><p>${esc(c.problem||'').replace(/\n/g,'<br>')}</p></div><div class="block"><label>Requested outcome</label><p>${esc(c.requested_outcome||'')}</p></div>${c.ai_analysis?`<div class="ai-box"><div class="ai-head"><b>AI case analyst</b><span>${esc(a.severity||'')} · ${Math.round(Number(a.confidence||0)*100)}% confidence</span></div><p><b>Assessment:</b> ${esc(a.discrepancy||'')}</p><p><b>Recommended route:</b> ${esc(a.recommended_route||'')}</p><p><b>Evidence:</b> ${(a.evidence_needed||[]).map(esc).join(' · ')}</p><p><b>Next actions:</b> ${(a.next_actions||[]).map(esc).join(' · ')}</p>${a.merchant_message?`<p><b>Draft merchant message:</b><br>${esc(a.merchant_message)}</p><button class="btn btn-light" onclick="copyText(${JSON.stringify(a.merchant_message)})">Copy merchant message</button>`:''}</div>`:'<div class="ai-box muted-box"><b>No AI analysis yet.</b><p>Run the analyst after confirming the facts and evidence.</p></div>'}<div class="actions"><button class="btn btn-dark" id="analyzeBtn" onclick="analyzeCase('${esc(c.id)}')">Analyze with AI</button><select id="statusSelect"><option value="new" ${c.status==='new'?'selected':''}>New</option><option value="Investigating" ${c.status==='Investigating'?'selected':''}>Investigating</option><option value="Contacted" ${c.status==='Contacted'?'selected':''}>Contacted</option><option value="Recovered" ${c.status==='Recovered'?'selected':''}>Recovered</option><option value="Closed" ${c.status==='Closed'?'selected':''}>Closed</option></select><input id="recoveredInput" type="number" min="0" step="0.01" placeholder="Recovered €" value="${Number(c.recovered_amount||0)||''}"><button class="btn btn-light" onclick="saveCase('${esc(c.id)}')">Save case</button></div>`}
async function load(){try{const j=await api('/api/admin-cases');cases=j.cases||[];render()}catch(e){$('list').innerHTML=`<div class="empty error-box">${esc(e.message)}</div>`}}
async function login(){token=$('token').value.trim();if(!token)return;sessionStorage.setItem('undo_admin_token',token);await load()}
async function saveCase(id){try{const status=$('statusSelect').value,recovered=$('recoveredInput').value;await api('/api/admin-cases',{method:'PATCH',body:JSON.stringify({id,status,recovered_amount:Number(recovered||0)})});await load();showCase(id);toast('Case saved')}catch(e){toast(e.message)}}
async function analyzeCase(id){const b=$('analyzeBtn');b.disabled=true;b.textContent='Analyzing…';try{await api('/api/analyze',{method:'POST',body:JSON.stringify({case_id:id})});await load();showCase(id);toast('AI analysis complete')}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='Analyze with AI'}}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Merchant message copied')}catch{toast('Copy unavailable')}}
$('loginBtn').onclick=login;$('search').oninput=render;$('filter').onchange=render;if(token)load();
</script></body></html>
