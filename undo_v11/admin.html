<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNDO — Case desk</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><header class="site-nav wrap"><a class="brand" href="index.html"><span class="brand-mark">U</span><span>UNDO</span></a><nav><a href="index.html">Public site</a></nav></header><main class="wrap admin-main"><div class="admin-top"><div><div class="eyebrow">INTERNAL</div><h1>Case desk</h1><p>One place to triage, analyze and track recovery.</p></div><div class="token-box"><input id="token" type="password" placeholder="Admin token"><button class="btn btn-dark" id="loginBtn">Unlock</button></div></div><section class="admin-stats"><div><span>Open</span><strong id="open">—</strong></div><div><span>Potential value</span><strong id="potential">€0</strong></div><div><span>Recovered</span><strong id="recovered">€0</strong></div><div><span>Fees</span><strong id="fees">€0</strong></div></section><section class="admin-grid"><div class="list" id="list"><div class="empty">Enter your admin token to load cases.</div></div><aside class="detail" id="detail"><div class="empty">Select a case.</div></aside></section></main><script>
let token=sessionStorage.getItem('undo_admin_token')||'';let cases=[];const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(Number(n||0));
$('token').value=token;
async function api(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:`Bearer ${token}`,'Content-Type':'application/json'};const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const open=cases.filter(c=>!['Recovered','Closed','recovered','closed'].includes(c.status)).length;const potential=cases.reduce((a,c)=>a+Number(c.amount||0),0);const rec=cases.reduce((a,c)=>a+Number(c.recovered_amount||0),0);const fees=cases.reduce((a,c)=>a+Number(c.recovery_fee||0),0);$('open').textContent=open;$('potential').textContent=fmt(potential);$('recovered').textContent=fmt(rec);$('fees').textContent=fmt(fees);$('list').innerHTML=cases.length?cases.map(c=>`<button class="admin-row" data-id="${c.id}"><span><b>${esc(c.case_number)}</b><small>${esc(c.merchant||'')} · ${esc(c.status||'new')}</small></span><strong>${fmt(c.amount)}</strong></button>`).join(''):'<div class="empty">No cases yet.</div>';document.querySelectorAll('.admin-row').forEach(x=>x.onclick=()=>showCase(x.dataset.id))}
function showCase(id){const c=cases.find(x=>String(x.id)===String(id));if(!c)return;let analysis=c.ai_analysis||{};$('detail').innerHTML=`<div class="detail-top"><div><div class="eyebrow">${esc(c.case_number)}</div><h2>${esc(c.merchant||'Unknown merchant')}</h2><p>${esc(c.customer_name||'')} · ${esc(c.customer_email||'')}</p></div><div class="score"><span>${esc(analysis.recoverability||'UNANALYZED')}</span><small>recoverability</small></div></div><div class="detail-grid"><div><label>Amount</label><strong>${fmt(c.amount)}</strong></div><div><label>Status</label><strong>${esc(c.status||'new')}</strong></div><div><label>Recovered</label><strong>${fmt(c.recovered_amount)}</strong></div><div><label>Success fee</label><strong>${fmt(c.recovery_fee)}</strong></div></div><div class="block"><label>What happened</label><p>${esc(c.problem||'').replace(/\n/g,'<br>')}</p></div><div class="block"><label>Customer wants</label><p>${esc(c.requested_outcome||'')}</p></div>${c.ai_analysis?`<div class="ai-box"><div class="ai-head"><b>AI case analyst</b><span>${esc(analysis.severity||'')} · ${Math.round(Number(analysis.confidence||0)*100)}% confidence</span></div><p><b>Assessment:</b> ${esc(analysis.discrepancy||'')}</p><p><b>Recommended route:</b> ${esc(analysis.recommended_route||'')}</p><p><b>Next actions:</b> ${(analysis.next_actions||[]).map(esc).join(' · ')}</p><p><b>Evidence:</b> ${(analysis.evidence_needed||[]).map(esc).join(' · ')}</p></div>`:'<div class="ai-box muted-box">No AI analysis yet. Run an analysis after reviewing the facts.</div>'}<div class="actions"><button class="btn btn-dark" onclick="analyzeCase('${c.id}')">Analyze with AI</button><select id="statusSelect"><option ${c.status==='new'?'selected':''} value="new">New</option><option ${c.status==='Investigating'?'selected':''} value="Investigating">Investigating</option><option ${c.status==='Contacted'?'selected':''} value="Contacted">Contacted</option><option ${c.status==='Recovered'?'selected':''} value="Recovered">Recovered</option><option ${c.status==='Closed'?'selected':''} value="Closed">Closed</option></select><input id="recoveredInput" type="number" min="0" step="0.01" placeholder="Recovered €" value="${Number(c.recovered_amount||0)||''}"><button class="btn btn-light" onclick="saveCase('${c.id}')">Save</button></div>`}
async function load(){try{const j=await api('/api/admin-cases');cases=j.cases||[];render()}catch(e){$('list').innerHTML=`<div class="empty error-box">${esc(e.message)}</div>`}}
async function login(){token=$('token').value.trim();if(!token)return;sessionStorage.setItem('undo_admin_token',token);await load()}
async function saveCase(id){const status=$('statusSelect').value,recovered=$('recoveredInput').value;await api('/api/admin-cases',{method:'PATCH',body:JSON.stringify({id,status,recovered_amount:Number(recovered||0)})});await load();showCase(id)}
async function analyzeCase(id){const b=event?.target;b&& (b.disabled=true);try{await api('/api/analyze',{method:'POST',body:JSON.stringify({case_id:id})});await load();showCase(id)}finally{b&& (b.disabled=false)}}
$('loginBtn').onclick=login;if(token)load();
</script></body></html>
